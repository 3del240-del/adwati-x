<style>
:root{
  --bg:#f2f4f9; --card:#ffffff; --tx:#1b2440; --tx2:#5b6480; --line:#e3e7f1;
  --pri:#3f3fbe; --pri-deep:#2c2a8f; --vio:#6d3fc0; --cya:#0b8fa8;
  --ok:#188a4f; --err:#d23b3b; --soft:#eef0fa;
  --rad:16px; --rad-s:11px;
  --sh:0 1px 2px rgba(27,36,64,.05), 0 10px 30px -14px rgba(27,36,64,.16);
  --sh-hi:0 4px 8px rgba(27,36,64,.06), 0 20px 44px -16px rgba(63,63,190,.25);
  --f-head:'Aref Ruqaa','Sora',serif;
  --f-body:'IBM Plex Sans Arabic','Sora',sans-serif;
}
[data-theme="dark"]{
  --bg:#0c1224; --card:#151d33; --tx:#e9edfa; --tx2:#94a0c1; --line:#25304f;
  --pri:#8d94f7; --pri-deep:#a9aefe; --vio:#b39af0; --cya:#4cc4dc;
  --ok:#4ccb8a; --err:#ef7a7a; --soft:#1c2542;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.5);
  --sh-hi:0 6px 14px rgba(0,0,0,.35), 0 22px 48px -16px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:15.5px;line-height:1.7;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,.ruqaa{font-family:var(--f-head);font-weight:700;line-height:1.6}
[dir="ltr"] h1,[dir="ltr"] h2,[dir="ltr"] h3,[dir="ltr"] .ruqaa{line-height:1.25}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.hide{display:none!important}
#bootErr{display:none;background:var(--err);color:#fff;padding:10px 18px;font-size:13px;font-family:monospace;white-space:pre-wrap;direction:rtl}
i[data-lucide]{display:inline-block;width:20px;height:20px;flex:none}
i[data-lucide] svg{width:100%;height:100%;display:block}

header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:26px;height:64px}
.logo{display:flex;align-items:center;gap:11px;font-family:var(--f-head);font-size:23px}
.logo svg{width:34px;height:34px;flex:none}
nav.main{display:flex;gap:4px;margin-inline-start:8px}
nav.main a{padding:7px 13px;border-radius:9px;color:var(--tx2);font-weight:500;font-size:14.5px;transition:.18s}
nav.main a:hover{color:var(--tx);background:var(--soft)}
.hacts{margin-inline-start:auto;display:flex;align-items:center;gap:9px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--tx2);transition:.18s}
.iconbtn:hover{color:var(--pri);border-color:var(--pri)}
.langbtn{width:auto;padding:0 13px;font-weight:700;font-size:13.5px;letter-spacing:.4px}
#burger{display:none}
#mnav{display:none;border-bottom:1px solid var(--line);background:var(--card);padding:10px 22px 16px}
#mnav a{display:block;padding:11px 6px;border-bottom:1px solid var(--line);font-weight:500}
#mnav.open{display:block}

.hero{position:relative;padding:76px 0 58px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(640px 300px at 18% -8%, color-mix(in srgb,var(--pri) 10%,transparent), transparent 70%),
             radial-gradient(560px 280px at 85% 4%, color-mix(in srgb,var(--cya) 8%,transparent), transparent 70%);}
.hero .wrap{position:relative}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--pri);background:var(--soft);border:1px solid color-mix(in srgb,var(--pri) 22%,transparent);padding:5px 14px;border-radius:99px;margin-bottom:20px}
.hero h1{font-size:clamp(37px,6.4vw,62px);max-width:820px}
.hero h1 .tint{color:var(--pri)}
.hero p.sub{font-size:18px;color:var(--tx2);max-width:620px;margin:14px 0 30px}
.searchbox{position:relative;max-width:640px}
.searchbox .field{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:5px 8px;box-shadow:var(--sh);transition:.2s}
.searchbox .field:focus-within{border-color:var(--pri);box-shadow:var(--sh-hi)}
.searchbox i[data-lucide]{width:21px;height:21px;color:var(--tx2);margin-inline-start:14px}
.searchbox input{flex:1;border:0;outline:0;background:none;padding:12px 2px;font-size:16px;min-width:0}
.searchbox kbd{border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-size:12px;color:var(--tx2);background:var(--soft)}
.sresults{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-hi);overflow:hidden;z-index:20}
.sresults a{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.sresults a:last-child{border-bottom:0}
.sresults a:hover{background:var(--soft)}
.sresults .si{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--pri);flex:none}
.sresults b{font-size:14.5px;display:block}
.sresults small{color:var(--tx2);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.chips span{font-size:13px;color:var(--tx2);align-self:center;font-weight:500}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 16px;font-size:13.5px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:7px;transition:.18s}
.chip:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-1px)}

section.block{padding:46px 0 8px}
.sechead{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.sechead h2{font-size:29px}
.sechead .rule{flex:1;height:1px;background:var(--line);align-self:center;min-width:40px}
.sechead .count{font-size:13px;font-weight:700;color:var(--pri);background:var(--soft);padding:3px 12px;border-radius:99px}
.tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;display:flex;flex-direction:column;gap:9px;transition:.22s;position:relative}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--sh-hi);border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
.tcard .tico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.tcard .tico i[data-lucide]{width:22px;height:22px}
.c1{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.c2{background:color-mix(in srgb,var(--vio) 13%,transparent);color:var(--vio)}
.c3{background:color-mix(in srgb,var(--cya) 13%,transparent);color:var(--cya)}
.c4{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.tcard h3{font-size:17px}
.tcard p{font-size:13.5px;color:var(--tx2);flex:1}
.tcard .open{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pri);margin-top:4px}
.tcard .open i[data-lucide]{width:15px;height:15px;transition:.2s}
[dir="rtl"] .tcard .open i[data-lucide]{transform:scaleX(-1)}
.tcard:hover .open i[data-lucide]{transform:translateX(3px)}
[dir="rtl"] .tcard:hover .open i[data-lucide]{transform:translateX(-3px) scaleX(-1)}

.why{display:grid;grid-template-columns:1fr 1.2fr;gap:44px;align-items:start;padding:52px 0}
.why h2{font-size:34px;margin-bottom:12px}
.why .lead{color:var(--tx2);max-width:420px}
.why .stats{display:flex;gap:34px;margin-top:28px;flex-wrap:wrap}
.why .stats b{font-size:30px;color:var(--pri);display:block;font-family:var(--f-head)}
.why .stats span{font-size:13px;color:var(--tx2)}
.whylist{display:flex;flex-direction:column}
.whyitem{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.whyitem:last-child{border-bottom:0}
.whyitem .num{font-family:var(--f-head);font-size:24px;color:var(--pri);opacity:.55;min-width:44px}
.whyitem b{display:block;margin-bottom:3px}
.whyitem p{font-size:14px;color:var(--tx2)}

.faq{max-width:780px}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--rad-s);margin-bottom:11px;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;font-weight:700;cursor:pointer;font-size:15.5px}
summary::-webkit-details-marker{display:none}
summary .pl{margin-inline-start:auto;transition:.25s;color:var(--tx2)}
details[open] .pl{transform:rotate(45deg);color:var(--pri)}
details .ans{padding:0 20px 18px;color:var(--tx2);font-size:14.5px}

.toolpage{padding:38px 0 60px}
.crumb{font-size:13px;color:var(--tx2);margin-bottom:18px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crumb a:hover{color:var(--pri)}
.crumb i[data-lucide]{width:14px;height:14px}
.toolhead{display:flex;gap:18px;align-items:center;margin-bottom:26px}
.toolhead .tico{width:60px;height:60px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none}
.toolhead .tico i[data-lucide]{width:29px;height:29px}
.toolhead h1{font-size:31px}
.toolhead p{color:var(--tx2);font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:26px;box-shadow:var(--sh)}
.drop{border:2px dashed color-mix(in srgb,var(--pri) 35%,var(--line));border-radius:var(--rad);padding:46px 20px;text-align:center;cursor:pointer;transition:.2s;background:color-mix(in srgb,var(--pri) 3%,transparent)}
.drop:hover,.drop.over{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,transparent)}
.drop i[data-lucide]{width:38px;height:38px;color:var(--pri);margin-bottom:10px}
.drop b{display:block;font-size:16.5px}
.drop small{color:var(--tx2);display:block;margin-top:5px;font-size:13px}
.meta-line{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin-top:14px}
.meta-line span{display:inline-flex;align-items:center;gap:6px}
.meta-line i[data-lucide]{width:14px;height:14px;color:var(--pri)}
.privnote{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--tx2);background:color-mix(in srgb,var(--ok) 8%,transparent);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent);border-radius:10px;padding:9px 14px;margin-top:16px}
.privnote i[data-lucide]{width:16px;height:16px;color:var(--ok);flex:none}
.flist{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:var(--rad-s);padding:11px 14px}
.fthumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--soft);flex:none}
.fthumb.ph{display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.frow .fi{flex:1;min-width:0}
.frow .fi b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.frow .fi small{color:var(--tx2);font-size:12.5px}
.frow .rm{color:var(--tx2);border:0;background:none;padding:6px;border-radius:8px}
.frow .rm:hover{color:var(--err);background:var(--soft)}
.trimui{margin-top:18px;border:1px solid var(--line);border-radius:var(--rad-s);padding:14px;background:var(--soft)}
.trimui video{width:100%;max-height:320px;border-radius:10px;background:#000;display:block}
.trimui audio{width:100%;display:block;margin-top:4px}
.trow{display:flex;align-items:center;gap:10px;margin-top:10px}
.trow label{font-size:13px;font-weight:700;min-width:52px}
.trow input{flex:1;accent-color:var(--pri);min-width:0}
.dbar{height:10px;background:var(--line);border-radius:99px;position:relative;margin-top:12px;overflow:hidden}
.dfill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--pri),var(--vio));border-radius:99px}
.ctrls{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.ctrl label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.ctrl select,.ctrl input[type=text],.ctrl input[type=number],.ctrl input[type=password]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:0;transition:.18s}
.ctrl select:focus,.ctrl input:focus{border-color:var(--pri)}
.ctrl input[type=range]{width:100%;accent-color:var(--pri)}
.ctrl .rval{font-size:12.5px;color:var(--pri);font-weight:700}
.ctrl.check{display:flex;align-items:center;gap:9px}
.ctrl.check input{width:17px;height:17px;accent-color:var(--pri)}
.ctrl textarea{width:100%;min-height:120px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:0;resize:vertical}
.actrow{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 26px;border-radius:12px;font-weight:700;font-size:15px;border:1.5px solid transparent;transition:.18s}
.btn i[data-lucide]{width:18px;height:18px}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-deep);transform:translateY(-1px);box-shadow:var(--sh-hi)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--tx)}
.btn-ghost:hover{border-color:var(--pri);color:var(--pri)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
.pwrap{margin-top:22px}
.pbar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--vio));border-radius:99px;transition:width .25s}
.ptext{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);margin-top:8px}
.done{margin-top:22px;border:1.5px solid color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 7%,transparent);border-radius:var(--rad);padding:22px;animation:pop .4s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1}}
.done .dhead{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--ok);font-size:16.5px;margin-bottom:14px;flex-wrap:wrap}
.done .dhead i[data-lucide]{width:24px;height:24px}
.sizes{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:16px}
.sizes div b{display:block;font-size:19px}
.sizes div small{color:var(--tx2);font-size:12.5px}
.sizes .save{color:var(--ok)}
.resimg{max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--line);margin-bottom:16px}
.restext{width:100%;min-height:160px;padding:13px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);font-size:14.5px;resize:vertical}
.cropzone{position:relative;user-select:none;touch-action:none;max-width:100%;border-radius:12px;overflow:hidden;display:block}
.cropbox{position:absolute;border:2px solid var(--pri);box-shadow:0 0 0 9999px rgba(10,14,30,.55);cursor:move}
.cropbox .h{position:absolute;width:16px;height:16px;background:var(--pri);border-radius:4px;inset-inline-end:-9px;bottom:-9px;cursor:nwse-resize}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
#qrbox{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;border:1px solid var(--line);border-radius:var(--rad);background:var(--soft);min-height:230px;gap:14px}
#qrbox canvas{background:#fff;border-radius:8px;max-width:100%}
.dlopt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:var(--rad-s);padding:14px 16px;margin-top:12px;background:var(--card);transition:.18s}
.dlopt:hover{border-color:var(--pri)}
.dlopt .di{width:42px;height:42px;border-radius:11px;background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.dlopt .db{flex:1;min-width:0}
.dlopt .db b{display:block;font-size:15px}
.dlopt .db small{color:var(--tx2);font-size:12.5px}
.pwfield{display:flex;gap:9px;align-items:center}
.pwfield input{flex:1;min-width:0;padding:13px 15px;border:1.5px solid var(--line);border-radius:11px;font-size:17px;letter-spacing:1px;background:var(--soft);direction:ltr;text-align:start;font-family:'Sora',monospace}
.strength{height:7px;border-radius:99px;background:var(--soft);margin-top:11px;overflow:hidden}
.strength div{height:100%;width:0;transition:.3s;border-radius:99px}
.suglist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sugrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;direction:ltr;justify-content:space-between}
.sugrow code{font-family:'Sora',monospace;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toasts{position:fixed;bottom:20px;inset-inline-start:20px;z-index:99;display:flex;flex-direction:column;gap:9px}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--pri);border-radius:11px;padding:12px 17px;box-shadow:var(--sh-hi);font-size:14px;max-width:340px;animation:tin .3s}
.toast.err{border-inline-start-color:var(--err)}
.toast.ok{border-inline-start-color:var(--ok)}
.toast i[data-lucide]{width:18px;height:18px;flex:none;color:var(--tx2)}
.toast.err i{color:var(--err)}.toast.ok i{color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1}}

.statpage{max-width:780px;padding:44px 0 70px}
.statpage h1{font-size:34px;margin-bottom:20px}
.statpage p{color:var(--tx2);margin-bottom:12px}
.statpage h3{margin:22px 0 8px;font-size:20px}

footer{border-top:1px solid var(--line);margin-top:56px;background:var(--card)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px;padding:46px 0 30px}
.fgrid h4{font-size:15px;margin-bottom:13px}
.fgrid a{display:block;color:var(--tx2);font-size:14px;padding:4px 0}
.fgrid a:hover{color:var(--pri)}
.fgrid .fabout p{color:var(--tx2);font-size:13.5px;margin-top:11px;max-width:250px}
.fbottom{border-top:1px solid var(--line);padding:17px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--tx2)}

function textToPdfBlob(text){
 return needLib(CDN.jspdf).then(function(){
  var jsPDF=window.jspdf.jsPDF;
  var isRTL=/[\u0600-\u06FF]/.test(text);
  var CW=1240,CH=1754,M=90,FS=30,LH=48;
  var page=document.createElement('canvas');page.width=CW;page.height=CH;
  function newCtx(p){var x=p.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,CW,CH);x.fillStyle='#111';x.font=FS+'px "IBM Plex Sans Arabic", Sora, sans-serif';x.direction=isRTL?'rtl':'ltr';x.textAlign=isRTL?'right':'left';return x;}
  var x=newCtx(page),cy=M+FS,TX=isRTL?CW-M:M;
  var pages=[];
  function flushLine(cur){
   if(cy>CH-M){pages.push(page);page=document.createElement('canvas');page.width=CW;page.height=CH;x=newCtx(page);cy=M+FS;}
   x.fillText(cur,TX,cy);cy+=LH;
  }
  text.split('\n').forEach(function(ln){
   var cur='';
   if(!ln.trim()){flushLine('');return;}
   ln.split(' ').forEach(function(w){
    var test=cur?cur+' '+w:w;
    if(x.measureText(test).width>CW-2*M){flushLine(cur);cur=w;}else cur=test;
   });
   if(cur)flushLine(cur);
  });
  pages.push(page);
  var pdf=new jsPDF({unit:'pt',format:'a4'});
  pages.forEach(function(p,i){
   if(i)pdf.addPage();
   pdf.addImage(p.toDataURL('image/jpeg',.9),'JPEG',0,0,595.28,841.89);
  });
  return pdf.output('blob');
 });
}

function removeBg(cv,tol){
 var x=cv.getContext('2d'),w=cv.width,h=cv.height;
 var d=x.getImageData(0,0,w,h),px=d.data;
 var seed=[px[0],px[1],px[2]];
 var visited=new Uint8Array(w*h),q=[],i;
 for(i=0;i<w;i++){q.push(i);q.push((h-1)*w+i);}
 for(i=0;i<h;i++){q.push(i*w);q.push(i*w+w-1);}
 var T=tol*tol*3;
 while(q.length){
  var p=q.pop();
  if(visited[p])continue;visited[p]=1;
  var o=p*4,dr=px[o]-seed[0],dg=px[o+1]-seed[1],db=px[o+2]-seed[2];
  if(dr*dr+dg*dg+db*db>T)continue;
  px[o+3]=0;
  var r=(p/w)|0,c=p%w;
  if(r>0)q.push(p-w);if(r<h-1)q.push(p+w);
  if(c>0)q.push(p-1);if(c<w-1)q.push(p+1);
 }

}

function fancyMap(map){
 return function(s){
  var out='';
  for(var i=0;i<s.length;i++){
   var ch=s[i],low=ch.toLowerCase(),up=map[low];
   out+=(up&&/^[A-Za-z]$/.test(ch))?up:ch;
  }
  return out;
 };
}

function bFancy(x,stage){
 stage.innerHTML='<div class="ctrl"><label>'+(LANG==='ar'?'أدخل الاسم أو النص (عربي أو إنجليزي)':'Enter a name or text (Arabic or English)')+'</label>'
  +'<textarea id="tin" placeholder="'+(LANG==='ar'?'مثال: محمد أو Mohammed':'e.g. Mohammed')+'" style="min-height:90px"></textarea></div>'
  +'<div class="actrow"><button class="btn btn-pri" id="go"><i data-lucide="wand-sparkles"></i>'+(LANG==='ar'?'زخرفة':'Decorate')+'</button></div>'
  +'<div id="out" style="margin-top:10px"></div>'
  +'<p style="color:var(--tx2);font-size:12.5px;margin-top:14px">'+(LANG==='ar'?'ملاحظة: أنماط الحروف (عريض، دائري، قديمي…) تعمل مع الأحرف الإنجليزية، وأنماط الإطارات ✦ ✿ ⚜ ꧁꧂ تعمل مع العربية والإنجليزية معًا. تُنسخ كنص وتعمل في واتساب وانستجرام وكل التطبيقات.':'Letter styles (Bold, Circled, Gothic…) apply to Latin letters; frames ✦ ✿ ⚜ ꧁꧂ work with both languages. Copied as plain text — works everywhere.')+'</p>';
 paintIcons();
 $('#go',stage).addEventListener('click',function(){
  var s=$('#tin',stage).value.trim();
  if(!s)return toast(LANG==='ar'?'أدخل نصًا أولًا.':'Enter some text first.','err');
  var box=$('#out',stage);
  box.innerHTML='';
  var count=0;
  FANCY.forEach(function(f){
   var res='';
   try{res=f.fn(s);}catch(e){res='';}
   if(!res)return;
   count++;
   var d=document.createElement('div');d.className='frow';
   d.innerHTML='<div class="fi"><b style="font-size:12px;color:var(--tx2);font-weight:700">'+t({ar:f.ar,en:f.en})+'</b><small style="display:block;font-size:16px;direction:ltr;text-align:start;word-break:break-all">'+esc(res)+'</small></div>'
    +'<button class="rm" title="copy"><i data-lucide="copy"></i></button>';
   box.appendChild(d);
   $('button',d).addEventListener('click',function(){copyTxt(res);});
  });
  paintIcons();
  if(!count)toast(LANG==='ar'?'لا توجد أنماط مطابقة — جرّب أحرفًا إنجليزية للأنماط الخاصة.':'No matching styles — try Latin letters for letter styles.','info');
  else toast(LANG==='ar'?('تم توليد '+count+' نمط زخرفي!'):('Generated '+count+' fancy styles!'),'ok');
 });
}

function normAr(s){return String(s).toLowerCase().replace(/[\u064B-\u0652\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ئ|ؤ/g,'ء');}
function searchTools(q){
 var nq=normAr(q).trim().split(/\s+/).filter(Boolean);
 if(!nq.length)return[];
 return TOOLS.map(function(x){
  var hay=normAr(x.ar.name+' '+x.en.name+' '+x.ar.desc+' '+x.en.desc+' '+CATS[x.cat].n.ar+' '+CATS[x.cat].n.en+' '+(x.kw||[]).join(' '));
  return{score:nq.reduce(function(a,w){return a+(hay.indexOf(w)>-1?1:0);},0),x:x};
 }).filter(function(r){return r.score===nq.length;}).slice(0,8).map(function(r){return r.x;});
}

 paintIcons();
 var sel=$('#v',stage),voices=[];
 function fill(){
  try{
   voices=speechSynthesis.getVoices()||[];
   var ar=voices.filter(function(v){return /^ar/i.test(v.lang);});
   var en=voices.filter(function(v){return /^en/i.test(v.lang);});
   var rest=voices.filter(function(v){return !/^ar|^en/i.test(v.lang);});
   var list=ar.concat(en,rest);
   sel.innerHTML='';
   if(!list.length){sel.innerHTML='<option>'+(LANG==='ar'?'صوت النظام الافتراضي':'System default voice')+'</option>';return;}
   list.slice(0,24).forEach(function(v){sel.add(new Option(v.name+' ('+v.lang+')',v.name));});
  }catch(e){}
 }
 try{fill();speechSynthesis.onvoiceschanged=fill;}catch(e){}

function showRate(){
 localStorage.setItem('adw_asked',+(localStorage.getItem('adw_asked')||0)+1);
 var ov=document.createElement('div');ov.id='rateModal';
 var stars='';
 for(var i=1;i<=5;i++)stars+='<button class="star" data-v="'+i+'"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6L12 2z"/></svg></button>';
 ov.innerHTML='<div class="rcard"><h3 class="ruqaa">'+(LANG==='ar'?'كيف كانت تجربتك؟':'How was your experience?')+'</h3>'
  +'<p>'+(LANG==='ar'?'تقييمك يساعدنا نطوّر أدواتي — ولن يستغرق ثواني.':'Your rating helps improve Adawati — takes seconds.')+'</p>'
  +'<div class="stars">'+stars+'</div>'
  +'<div class="actrow" style="justify-content:center">'
  +'<button class="btn btn-pri hide" id="rSend"><i data-lucide="send"></i>'+(LANG==='ar'?'إرسال':'Send')+'</button>'
  +'<button class="btn btn-ghost" id="rLater">'+(LANG==='ar'?'لاحقًا':'Later')+'</button></div></div>';
 document.body.appendChild(ov);paintIcons();
 var val=0;
 $$('.star',ov).forEach(function(b){
  b.addEventListener('click',function(){
   val=+b.dataset.v;
   $$('.star',ov).forEach(function(s){s.classList.toggle('on',+s.dataset.v<=val);});
   $('#rSend',ov).classList.remove('hide');
  });
 });
 $('#rLater',ov).addEventListener('click',function(){ov.remove();});
 $('#rSend',ov).addEventListener('click',function(){
  if(!val)return;
  ov.remove();
  var sbj=encodeURIComponent(LANG==='ar'?'تقييم موقع أدواتي':'Adawati rating');
  var body=encodeURIComponent((LANG==='ar'?'التقييم: ':'Rating: ')+val+'/5\n\n'+(LANG==='ar'?'ملاحظات (اختياري):':'Comments (optional):')+'\n');
  window.location.href='mailto:3del240@gmail.com?subject='+sbj+'&body='+body;
  toast(LANG==='ar'?'شكرًا لتقييمك! فتحنا بريدك لإرساله.':'Thanks! Your mail app opened to send it.','ok');
 });
}

function applyLangBtns(){
 var lbl=(LANG==='ar')?'EN':'ع';
 $('#langBtn').textContent=lbl;$('#fLang').textContent=lbl;
 $('#logoName').textContent=(LANG==='ar')?'أدواتي':'Adawati';
 $('#fLogo').textContent=(LANG==='ar')?'أدواتي':'Adawati';
}
function applyStatic(){
 $('#mainnav').innerHTML=navLinks();
 $('#mnav').innerHTML=navLinks();
 footerLinks();
 $$('[data-i18n]').forEach(function(el){var v=t(UI[el.dataset.i18n]);if(v)el.textContent=v;});
 applyLangBtns();
}
function switchLang(){
 LANG=(LANG==='ar')?'en':'ar';
 localStorage.setItem('adw_lang',LANG);
 document.documentElement.lang=LANG;
 document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
 applyStatic();route();
}
function setThemeIcons(){
 var n=(THEME==='dark')?'sun':'moon';
 $('#themeBtn').innerHTML='<i data-lucide="'+n+'"></i>';
 $('#fTheme').innerHTML='<i data-lucide="'+n+'"></i>';
 paintIcons();
}
function toggleTheme(){
 THEME=(THEME==='dark')?'light':'dark';
 localStorage.setItem('adw_theme',THEME);
 document.documentElement.dataset.theme=THEME;
 setThemeIcons();
}
 $('#themeBtn').addEventListener('click',toggleTheme);
 $('#fTheme').addEventListener('click',toggleTheme);
 $('#langBtn').addEventListener('click',switchLang);
 $('#fLang').addEventListener('click',switchLang);
 $('#burger').addEventListener('click',function(){$('#mnav').classList.toggle('open');});
window.addEventListener('hashchange',route);
applyStatic();
setThemeIcons();
route();
window.__ADW_OK=true;
</script>
